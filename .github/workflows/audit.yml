name: issue52 diagnostic
on: workflow_dispatch
jobs:
  compare:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    strategy:
      fail-fast: false
      matrix:
        revision: [e3d54a3f39cf84c948fa185624291b8399e9302a, 680bec11af9bdfa2c947c192074cc4ce1524ee45]
        budget: [8, 64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
      - name: Dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq nodejs npm poppler-utils qpdf build-essential >/dev/null
      - name: Detailed renderer evidence
        run: |
          python3 - <<'CODE'
          from pathlib import Path
          p=Path('tools/verify-layout.mjs')
          s=p.read_text().replace('needsRender: block.needsRender,', "needsRender: block.needsRender, fidelity: {...block.fidelity, ins: [...(block.fidelity?.ins ?? [])]}, galleyHash: block.galleyHash, foot: block.galley?.items?.filter(item => item.k === 'ins'), chunks: [...engine.chunks.map ?? []], diagnostics: engine.diagnostics, renderStats: engine.renderStats,")
          p.write_text(s)
          CODE
      - name: Footnote comparison
        env:
          TDOM_MAX_CHECKPOINTS: ${{ matrix.budget }}
          TDOM_DEBUG_BLOCKS: 1
        run: |
          failed=0
          for trial in 1 2 3 4 5 6 7 8; do
            node tools/verify-layout.mjs corpus/11-simple-live-preview.tex --verbose || failed=1
          done
          exit "$failed"
