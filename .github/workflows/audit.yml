name: issue52 diagnostic
on: workflow_dispatch
jobs:
  compare:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    strategy:
      matrix:
        revision: [e3d54a3, 680bec1]
        budget: [8, 64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
      - name: Dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq nodejs npm poppler-utils qpdf build-essential >/dev/null
      - name: Footnote comparison
        env:
          TDOM_MAX_CHECKPOINTS: ${{ matrix.budget }}
          TDOM_DEBUG_BLOCKS: 1
        run: node tools/verify-layout.mjs corpus/11-simple-live-preview.tex --verbose
