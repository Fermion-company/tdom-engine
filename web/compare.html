<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TDOM Engine — 比較</title>
<link rel="stylesheet" href="/style.css">
<style>
  /* Full-bleed compare view: the two documents fill the viewport, only the
     page sheets are white. Chrome inherits the app's tokens from style.css. */
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
  body.compare { display: flex; flex-direction: column; overflow: hidden; }

  #cmp-bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    height: var(--bar-h);
    padding: 0 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  #cmp-bar .brand { font-size: 13px; font-weight: 600; }
  #cmp-bar .spacer { flex: 1; }
  #cmp-bar button {
    height: var(--ctl-h);
    padding: 0 9px;
    border: 1px solid var(--line-2);
    border-radius: var(--radius);
    background: var(--surface-2);
    color: var(--text-2);
    font-family: var(--ui);
    font-size: 11px;
    cursor: pointer;
  }
  #cmp-bar button:hover { background: var(--surface-3); color: var(--text); }
  #cmp-bar .zoom { display: inline-flex; align-items: center; gap: 4px; }
  #cmp-bar .zoom button { min-width: 26px; padding: 0 7px; }
  #cmp-zoom-level { min-width: 40px; text-align: center; color: var(--text-2); font-variant-numeric: tabular-nums; }
  #cmp-bar label.sync {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--text-2); cursor: pointer; user-select: none;
  }
  #cmp-bar label.sync input { accent-color: var(--accent); }
  #cmp-status {
    color: var(--text-3); min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  #cmp-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .cmp-col { min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  .cmp-col:last-child { border-right: 0; }
  .cmp-col-head {
    flex: none;
    display: flex; align-items: center; gap: 8px;
    height: var(--head-h);
    padding: 0 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    color: var(--text-3);
    font-size: 11px;
  }
  .cmp-col-head .name { color: var(--text-2); }
  .cmp-scroll {
    flex: 1; min-height: 0; overflow: auto; background: var(--canvas);
    padding: 24px 0 56px; display: flex; flex-direction: column; align-items: center; gap: 24px;
  }
  /* page sheets sized by a shared width var so both columns match exactly */
  .cmp-page {
    position: relative; width: var(--page-w, 560px); flex: none;
    background: #fff; box-shadow: var(--page-shadow);
  }
  .cmp-page canvas { display: block; width: 100%; height: auto; }
  .cmp-page svg { display: block; width: 100%; height: auto; }
  .cmp-page .chunkwin { position: absolute; overflow: hidden; }
  .cmp-page .chunkwin img.chunk { display: block; width: 100%; height: auto; user-select: none; }
  .cmp-pageno {
    position: absolute; top: -17px; left: 0;
    font-size: 10px; color: var(--text-3); font-variant-numeric: tabular-nums;
  }
  .cmp-empty { color: var(--text-3); padding: 40px; text-align: center; font-size: 12px; }
  .cmp-page { transition: box-shadow 0.8s ease; }
  .cmp-page.flash { box-shadow: var(--page-shadow), 0 0 0 1px var(--accent); }
</style>
</head>
<body class="compare">
  <header id="cmp-bar">
    <span class="brand">TDOM 比較</span>
    <div class="zoom">
      <button id="cmp-zoom-out" title="縮小">−</button>
      <span id="cmp-zoom-level">100%</span>
      <button id="cmp-zoom-in" title="拡大">+</button>
      <button id="cmp-zoom-fit" title="幅に合わせる">合わせる</button>
    </div>
    <label class="sync"><input type="checkbox" id="cmp-sync" checked> スクロール同期</label>
    <button id="cmp-recompile" title="最新ソースを lualatex で今すぐコンパイル（通常は canonical 着地時に自動更新）">再コンパイル</button>
    <span class="spacer"></span>
    <span id="cmp-status"></span>
  </header>
  <div id="cmp-body">
    <section class="cmp-col" id="cmp-col-real">
      <div class="cmp-col-head"><span class="name">canonical</span> lualatex 実出力 → pdf.js</div>
      <div class="cmp-scroll" id="cmp-real"><div class="cmp-empty">読み込み中</div></div>
    </section>
    <section class="cmp-col" id="cmp-col-engine">
      <div class="cmp-col-head"><span class="name">provisional</span> <span id="cmp-engine-backend">TDOM エンジン</span></div>
      <div class="cmp-scroll" id="cmp-engine"><div class="cmp-empty">読み込み中</div></div>
    </section>
  </div>
  <script type="module" src="/compare.js"></script>
</body>
</html>
